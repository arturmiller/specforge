[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specforge"
version = "2.0.0"
description = "Deterministic requirements and compliance compiler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pyshacl>=0.31,<1",
  "rdfcanon>=1,<2",
  "rdflib>=7.2,<8",
  "sqlalchemy>=2,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
legacy = ["pyyaml>=6,<7"]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[project.scripts]
specforge = "specforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/specforge"]

[tool.hatch.build.targets.wheel.force-include]
"vocabulary/1.0.0" = "specforge/vocabulary/1.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "generated/calendar/app/backend"]
filterwarnings = [
  "ignore:Dataset.*deprecated:DeprecationWarning:rdflib.*",
  "ignore:.*deprecated.*:DeprecationWarning:rdflib.*",
  "ignore:Dataset.*deprecated:DeprecationWarning:rdfcanon.*",
  "ignore:.*deprecated.*:DeprecationWarning:pyparsing.*",
  "ignore:Testing an element's truth value.*:DeprecationWarning:specforge.rif",
]
