[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specforge"
version = "2.0.0"
description = "Deterministic requirements and compliance compiler"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
specforge = "specforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/specforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "generated/calendar/app/backend"]
