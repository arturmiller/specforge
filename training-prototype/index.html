<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interaktive SpecForge Academy – Throwaway UI prototype" />
    <title>SpecForge Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <nav class="prototype-switcher" aria-label="Prototyp-Variante">
      <button id="prev-variant" aria-label="Vorherige Variante">←</button>
      <span id="variant-label"></span>
      <button id="next-variant" aria-label="Nächste Variante">→</button>
    </nav>
    <script src="app.js"></script>
  </body>
</html>
