id: privacy/minimize-personal-data-response
version: "1.0.0"
when:
  all:
    - {fact: {subject: "$operation", predicate: returns, object: "$resource"}}
    - {fact: {subject: "$resource", predicate: contains_classification, object: PersonalData}}
    - not:
        fact: {subject: "$operation", predicate: action, object: delete}
then: {requirement: PRIVACY-001, target: "$operation"}
source: {type: internal_policy, document: privacy-policy, version: "1.0.0", section: response-minimization}
