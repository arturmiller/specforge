id: calendar/event-time-interval
version: "1.0.0"
when:
  all:
    - {fact: {subject: "$operation", predicate: acts_on, object: Event}}
    - any:
        - {fact: {subject: "$operation", predicate: action, object: create}}
        - {fact: {subject: "$operation", predicate: action, object: update}}
then: {requirement: DATA-001, target: "$operation"}
source: {type: architecture_policy, document: calendar-invariants, version: "1.0.0", section: event-time}
